<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Earn More</title>
<link rel="canonical" href="https://dutch71086.github.io/contact.html">
<meta property="og:title" content="Contact | Earn More">
<meta property="og:url" content="https://dutch71086.github.io/contact.html">
<meta name="description" content="Contact Earn More at dutch71086.github.io">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1e293b; background: #f8fafc; padding: 2rem 1rem; max-width: 600px; margin: 0 auto; }
  header { background: #2563eb; color: white; padding: 2rem 0; text-align: center; margin-bottom: 2rem; }
  h1 { font-size: 1.75rem; }
  .card { background: white; padding: 2rem; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 2rem; }
  h2 { color: #2563eb; margin-bottom: 1rem; font-size: 1.25rem; }
  p { margin-bottom: 1rem; color: #334155; }
  form { display: flex; flex-direction: column; gap: 1rem; }
  input, textarea { padding: 0.85rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 1rem; width: 100%; }
  button { padding: 0.85rem 1.5rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .back { display: inline-block; margin-top: 1rem; color: #2563eb; text-decoration: underline; }
  footer { text-align: center; color: #64748b; font-size: 0.85rem; margin-top: 2rem; }
</style>
</head>
<body>
<header><h1>Contact Us</h1></header>
<div class="card">
  <p>Have a question or want to work together? Send us a message.</p>
  <form id="contactForm">
    <input type="text" placeholder="Your name" required>
    <input type="email" placeholder="Your email" required>
    <textarea placeholder="Your message" rows="5" required></textarea>
    <button type="submit">Send Message</button>
  </form>
  <p id="msg"></p>
  <a href="index.html" class="back">← Back to Home</a>
</div>
<footer>&copy; 2026 Earn More. All rights reserved.</footer>
<script>
  document.getElementById('contactForm').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('msg').textContent = 'Thanks! We will get back to you soon.';
    document.getElementById('msg').style.color = '#059669';
    e.target.reset();
  });
</script>
</body>
</html>
